name: Forge Build

# Build-verification only — this workflow does NOT publish anything.
#
# It used to also build-and-push CUDA (amd64) and CPU (amd64+arm64) trainer
# images to GHCR on every push to main, tagged by commit sha. That publish
# path is gone: this now answers exactly one question, "does the Dockerfile
# still build", for both a PR and a push to main, and nothing else. No
# registry login, no GHCR credentials, no pushed layers anywhere.
#
# CONSEQUENCE WORTH KNOWING: nothing in this repo's CI publishes a forge
# image anymore, sha-tagged or otherwise. `oww_forge/docker-compose.deploy.yml`
# pulls `ghcr.io/.../echomuse-forge:latest` and `:latest-cpu`, and neither has
# ever had anything published under this fork's own GHCR namespace to pull.
# If that deployment path needs to work, something (a manual build+push, or a
# revived publish step) has to fill that gap; it is not this workflow's job
# anymore.
#
# Why it exists at all: every pin in oww_forge/Dockerfile is load-bearing —
# piper-sample-generator v2.0.0 for its flat layout, an openWakeWord SHA
# carrying a local patch, torch 2.7.1 — and a local `docker compose build`
# re-resolves the floating layers underneath them every time it runs, so a
# build check here is the only thing that catches a broken pin before someone
# sits through a local build to find out. oww_forge/Dockerfile isn't even a
# Dependabot ecosystem (see dependabot.yml), because its pins are baked into
# RUN commands rather than a manifest Dependabot can parse, so this is also
# the only automated signal this Dockerfile gets at all.
#
# CPU/amd64 only, on purpose: this answers "does the Dockerfile still build",
# and the CUDA/arm64 variants install the same wheels from the same base
# image for that question — a second architecture or backend under QEMU/no-
# GPU would cost runner minutes to restate the answer. Docker Desktop on
# macOS runs containers in a Linux VM with no Metal/MPS passthrough anyway,
# so an arm64 build here would not even be validating a GPU path.
#
# Gated at the trigger to oww_forge/Dockerfile and this workflow file only —
# application code under oww_forge/ (forge.py, forge_web.py, ...) cannot
# break the image build in a way the unit-test workflow's forge-tests job
# misses, on a push to main exactly as much as on a PR, so both triggers
# share the same path list.

on:
  pull_request:
    branches: [main]
    paths:
      - 'oww_forge/Dockerfile'
      - '.github/workflows/forge-build.yml'
  push:
    branches: [main]
    paths:
      - 'oww_forge/Dockerfile'
      - '.github/workflows/forge-build.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Verify forge image builds (CPU, amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the forge image (CPU, amd64)
        uses: docker/build-push-action@v7
        with:
          context: oww_forge
          file: oww_forge/Dockerfile
          platforms: linux/amd64
          build-args: GPU=0
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
