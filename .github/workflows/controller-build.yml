name: Controller Build

# Build-verification only — this workflow does NOT publish anything.
#
# It used to also build-and-push a `:sha-<short>` image to GHCR on every
# push to main (plus an SBOM and a vulnerability scan of that image). That
# publish path is gone: this now answers exactly one question, "does the
# controller image build", for both a PR and a push to main, and nothing
# else. No registry login, no GHCR credentials, no pushed layers anywhere.
#
# CONSEQUENCE WORTH KNOWING: nothing in this repo's CI publishes a
# controller image anymore, sha-tagged or otherwise. `docker-compose.deploy.yml`
# pulls `ghcr.io/.../echomuse-controller:latest` and the Home Assistant add-on
# (`controller/config.yaml`'s `image:`) pulls a version tag — neither has ever
# had anything published under this fork's own GHCR namespace to pull. If
# either deployment path needs to work, something (a manual build+push, or a
# revived publish step) has to fill that gap; it is not this workflow's job
# anymore.
#
# Why it exists at all: NOTHING else builds this image. The unit-test
# workflow pins itself to python-version 3.12 regardless of what the
# Dockerfile says, so a base-image or dependency bump can arrive with every
# other check green and no evidence behind any of them.
#
# That is not hypothetical. Dependabot #127 (python:3.12-slim -> 3.14-slim)
# was green on every check while speexdsp-ns==0.1.2 has no wheel past cp312
# and onnxruntime==1.20.1 none past cp313, so the image could not have built
# at all.
#
# Deliberately narrow, because a full image build is minutes:
#   - Only when Dockerfile/requirements.txt/this workflow file changed.
#     Application code cannot break the build in a way the unit tests miss;
#     a missing wheel is exactly what they cannot see, and it can only come
#     from one of those three paths — true for a push to main exactly as
#     much as for a PR, so both triggers share the same path list.
#   - amd64 only. The break this catches is a missing wheel or an apt
#     package that moved, both of which show up on either architecture, and
#     arm64 under QEMU costs far more than it adds.
#   - No push, no registry login, no GHCR credentials. This answers
#     "does it build", nothing more.

on:
  pull_request:
    branches: [main]
    paths:
      - 'controller/Dockerfile'
      - 'controller/requirements.txt'
      - '.github/workflows/controller-build.yml'
  push:
    branches: [main]
    paths:
      - 'controller/Dockerfile'
      - 'controller/requirements.txt'
      - '.github/workflows/controller-build.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Verify controller image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the controller image
        uses: docker/build-push-action@v7
        with:
          context: controller
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
