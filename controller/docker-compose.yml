services:
  echomuse-controller:
    build:
      context: .
      args:
        # CUDA onnxruntime for wake-word inference on this host's GPU.
        # The published GHCR image (docker-compose.deploy.yml) is CPU-only.
        GPU: "1"
    container_name: echomuse-controller
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/New_York
      - DEBUG=1
    env_file:
      - .env
    volumes:
      # Persist database across container rebuilds. Relative to this file's
      # directory (controller/), NOT the shell's cwd — `~EchoMuse/...` here
      # used to silently resolve to a stale, unrelated directory from an old
      # checkout location rather than erroring, so `docker compose up` on a
      # clean host quietly ran against an empty database next to the real
      # one instead of failing loudly.
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
