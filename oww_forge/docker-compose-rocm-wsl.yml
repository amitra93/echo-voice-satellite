## oww_forge on an AMD Radeon GPU under WSL2 (ROCm / ROCDXG).
##
## This is the AMD counterpart to docker-compose.yml (which is NVIDIA/CUDA).
## It builds the image with GPU="rocm" (AMD ROCm 7.2 torch wheels) and forwards
## the WSL GPU into the container.
##
##   docker compose -f docker-compose.rocm.yml build forge-ui
##   docker compose -f docker-compose.rocm.yml up -d forge-ui          # UI :8769
##   docker compose -f docker-compose.rocm.yml run --rm forge assets   # or CLI
##   docker compose -f docker-compose.rocm.yml run --rm forge new "hey biscuit"
##   docker compose -f docker-compose.rocm.yml run --rm forge build hey_biscuit
##
## Host prerequisites (verify BEFORE building):
##   * Windows: "AMD Software: Adrenalin Edition FOR WSL2" (>= 26.2.2) installed.
##   * WSL Ubuntu: AMD's in-WSL ROCm installed, so all of these exist —
##       /opt/rocm/lib/librocdxg.so      (the WSL<->/dev/dxg compute shim)
##       /dev/dxg                        (the WSL2 paravirtual GPU device)
##     and `rocminfo` lists your GPU as gfx1201 (RX 9070 XT) / gfx110x (7000).
##   librocdxg is NOT a Windows System32 library and is NOT baked into the
##   image; it is mounted from the host below. If `rocminfo` can't see the GPU,
##   fix that first — the container cannot conjure GPU access the host lacks.
##
## The `amdsmi` warning and the "SharedSignalPool ... Signals leaked" line at
## exit are benign under WSL (amdsmi needs /dev/kfd, absent on WSL); compute
## still works. Not applicable outside WSL — on native Linux use the standard
## ROCm device passthrough (/dev/kfd + /dev/dri) instead of /dev/dxg.

x-forge-rocm-base: &forge-rocm-base
  image: oww-forge-rocm
  build:
    context: .
    args:
      GPU: "rocm"
  # torch DataLoader workers pass tensors via /dev/shm; Docker's 64MB default
  # kills them with bus errors during the training step.
  shm_size: "8gb"
  # The WSL2 GPU device. World rw (crw-rw-rw-), so no group_add is needed.
  devices:
    - "/dev/dxg:/dev/dxg"
  volumes:
    # Assets (~25GB), per-wake-word workdirs, and finished models.
    - ./data:/data
    # Host WSL D3D12/dxcore libs that librocdxg dlopen's at runtime.
    - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    # Host ROCm install — provides librocdxg.so + rocdxg config. Read-only, and
    # it does not shadow the torch-bundled ROCm libs (those live under the
    # torch package's own lib dir with an $ORIGIN rpath).
    - /opt/rocm:/opt/rocm:ro
  environment:
    - LD_LIBRARY_PATH=/opt/rocm/lib:/usr/lib/wsl/lib
    # Only needed for Google TTS positives — put a service-account JSON at
    # ./data/google-credentials.json (gitignored) or drop this mapping.
    - GOOGLE_APPLICATION_CREDENTIALS=/data/google-credentials.json
    # Required only for the official full Common Voice 26 download.
    - MDC_API_KEY=${MDC_API_KEY:-}
    # huggingface_hub's default read timeout is 10s; streaming a multi-hundred-MB
    # parquet shard (FLEURS en_us is ONE file) over a slow CDN route trips it
    # mid-read and forces full-request retries. 60s rides out CDN stalls.
    - HF_HUB_DOWNLOAD_TIMEOUT=60
    # Rust multi-connection downloader for hf_hub_download — turns the FLEURS/
    # VoxPopuli shard fetches from one throttled CDN stream into parallel
    # range requests. Requires the hf_transfer pip package (requirements.txt).
    - HF_HUB_ENABLE_HF_TRANSFER=1

services:
  # web frontend (long-running); training jobs spawn inside this container
  forge-ui:
    <<: *forge-rocm-base
    container_name: oww-forge-ui
    command: ["ui"]
    ports:
      - "8769:8769"
    restart: unless-stopped

  # one-shot CLI with GPU
  forge:
    <<: *forge-rocm-base
    profiles: ["cli"]
