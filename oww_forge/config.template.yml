# openWakeWord training config — generated by forge.py, one per wake word.
# Field semantics follow openWakeWord examples/custom_model.yml (pinned SHA in Dockerfile).
# You can edit this file after `forge.py new` and before `forge.py build`.

model_name: "@NAME@"

# Phrase(s) the model activates on. Multiple entries still train ONE binary
# model that fires on any of them — use alternate phonetic spellings to cover
# how the phrase is actually pronounced in your house ("hey clara" is read
# with an American vowel; add "hey clarra" for a British reading).
target_phrase:
@PHRASES@

# Phrases the model must NOT activate on (beyond the automatic phoneme-overlap
# adversarial negatives). Add problem words you observe in practice.
custom_negative_phrases: []

# Google Chirp 3 generation defaults. The UI uses these when adding extra TTS
# samples; sample count applies to every matching locale/voice pair.
google_tts_languages: "en-US,en-GB,en-AU,en-IN,en-PH,en-SG,en-ZA"
google_tts_voices: ""
google_tts_samples_per_voice: 250
google_tts_qps: 2

# Optional source weights for the generated training view. Leave every value
# null to train on each source in its natural file-count proportion.
training_mix:
  positive:
    custom: null
    piper: null
    google: null
  negative:
    custom: null
    piper: null
    google: null

# Synthetic positives: 20k minimum recommended, 100k+ is best.
n_samples: @N_SAMPLES@
n_samples_val: @N_SAMPLES_VAL@

tts_batch_size: 50
augmentation_batch_size: 16
augmentation_rounds: 1

piper_sample_generator_path: "/opt/piper-sample-generator"

# train.py writes clips to <output_dir>/<model_name>/{positive,negative}_{train,test}
# and the final model to <output_dir>/<model_name>.onnx
output_dir: "@OUTPUT_DIR@"

rir_paths:
  - "/data/assets/mit_rirs"

background_paths:
  - "/data/assets/audioset_16k"
  - "/data/assets/fma_16k"
background_paths_duplication_rate:
  - 1
  - 1

false_positive_validation_data_path: "/data/assets/features/validation_set_features.npy"

# Optional public-corpus additions. Download the corresponding asset in the
# Forge UI, then enable it per wake word. The build resolves these into the
# upstream keys above. Common Voice retains the official archive; AMI streams
# directly into its compact validation feature array.
use_common_voice_negatives: false
use_ami_farfield_validation: false
use_fleurs_negatives: false
use_voxpopuli_negatives: false
use_musan_background: false
use_slr28_augmentation: false

feature_data_files:
  "ACAV100M_sample": "/data/assets/features/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32

steps: @STEPS@
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
